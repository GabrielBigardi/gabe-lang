name: Compiler CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025
            go_arch: x64
          - platform: Windows ARM64
            runner: windows-11-arm
            go_arch: arm64
          - platform: Linux x64
            runner: ubuntu-24.04
            go_arch: x64
          - platform: Linux ARM64
            runner: ubuntu-24.04-arm
            go_arch: arm64
          - platform: macOS x64
            runner: macos-15-intel
            go_arch: x64
          - platform: macOS ARM64
            runner: macos-15
            go_arch: arm64
    env:
      CGO_ENABLED: '0'
      GOTOOLCHAIN: local
      GABE_REQUIRE_NATIVE_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native Go toolchain
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          architecture: ${{ matrix.go_arch }}
      - name: Show compiler and LLVM versions
        run: |
          go version
          clang --version
      - name: Check formatting
        run: go run ./tools/checkfmt
      - name: Check lints
        run: go vet ./...
      - name: Run frontend and required native tests
        run: go test -count=1 ./...
      - name: Build compiler
        run: go build -trimpath -o bin/ ./cmd/gabe
