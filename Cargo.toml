[workspace]
members = ["crates/gabe-compiler", "crates/gabe-cli"]
default-members = ["crates/gabe-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Gabriel Bigardi"]
description = "Gabe: a native, LLVM-backed language with C#-inspired syntax"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
